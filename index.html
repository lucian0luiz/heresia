<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heresia — Players</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:#f6f7ff;
    }
    body{
      display:flex;
      justify-content:center;
      font-family:Arial,Helvetica,sans-serif;
    }
    .page{
      position:relative;
      width:min(100%,1068px);
      margin:0 auto;
      line-height:0;
    }
    .page-image{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* As hitboxes são completamente invisíveis.
       Nada de contorno/caixa aparecendo ao passar o mouse. */
    .hotspot{
      position:absolute;
      display:block;
      z-index:5;
      background:transparent;
      text-decoration:none;
      outline:none;
      cursor:pointer;
    }
    .hotspot:focus-visible{
      outline:2px solid rgba(32,41,92,.55);
      outline-offset:2px;
      border-radius:10px;
    }

    /* TOPO — caixas pequenas, só em cima do texto/botão */
    .top-heresia{left:24.2%;top:.31%;width:5.2%;height:.45%}
    .top-sistema{left:31.6%;top:.31%;width:5.1%;height:.45%}
    .top-players-1{left:39.2%;top:.31%;width:5.1%;height:.45%}
    .top-players-2{left:46.4%;top:.31%;width:5.3%;height:.45%}
    .top-mundo{left:55.0%;top:.31%;width:4.8%;height:.45%}
    .top-ideologias{left:61.3%;top:.31%;width:6.6%;height:.45%}
    .top-atos{left:70.8%;top:.31%;width:3.5%;height:.45%}
    .top-midia{left:76.4%;top:.31%;width:3.8%;height:.45%}
    .site{left:40.0%;top:2.02%;width:20.4%;height:1.28%;border-radius:999px}

    /* PERSONAGENS
       Cada personagem tem DUAS hitboxes:
       1) retrato à esquerda
       2) nome à direita
       Assim não existe mais uma faixa gigante clicável atravessando a página. */

    /* Castiel */
    .castiel-photo{left:0%;top:11.15%;width:39.7%;height:13.4%;border-radius:0 28px 28px 0}
    .castiel-name{left:46.0%;top:14.0%;width:38.5%;height:6.3%}

    /* Ksenia */
    .ksenia-photo{left:0%;top:27.55%;width:39.7%;height:13.0%;border-radius:0 28px 28px 0}
    .ksenia-name{left:45.8%;top:30.6%;width:41.0%;height:6.8%}

    /* Lucas + Fantasma */
    .lucas-photo{left:0%;top:43.85%;width:39.5%;height:14.0%;border-radius:0 28px 28px 0}
    .lucas-name{left:46.0%;top:47.5%;width:39.0%;height:6.5%}

    /* Moira */
    .moira-photo{left:0%;top:59.9%;width:39.5%;height:13.6%;border-radius:0 28px 28px 0}
    .moira-name{left:46.1%;top:63.2%;width:39.0%;height:6.1%}

    /* Thorfinn */
    .thorfinn-photo{left:0%;top:76.2%;width:39.5%;height:13.6%;border-radius:0 28px 28px 0}
    .thorfinn-name{left:45.0%;top:79.2%;width:42.0%;height:6.8%}

    /* FOOTER PRINCIPAL — só os próprios pills */
    .f-heresia{left:6.1%;top:91.05%;width:11.3%;height:.82%;border-radius:999px}
    .f-sistema{left:19.0%;top:91.05%;width:11.2%;height:.82%;border-radius:999px}
    .f-personagens{left:32.0%;top:91.05%;width:12.4%;height:.82%;border-radius:999px}
    .f-mundo{left:46.7%;top:91.05%;width:10.9%;height:.82%;border-radius:999px}
    .f-ideologias{left:59.4%;top:91.05%;width:12.0%;height:.82%;border-radius:999px}
    .f-atos{left:73.6%;top:91.05%;width:10.7%;height:.82%;border-radius:999px}
    .f-midia{left:86.1%;top:91.05%;width:10.3%;height:.82%;border-radius:999px}

    .f-atributos{left:32.3%;top:92.50%;width:12.0%;height:.82%;border-radius:999px}
    .f-mecanicas{left:46.8%;top:92.50%;width:11.8%;height:.82%;border-radius:999px}
    .f-individuais{left:59.7%;top:92.50%;width:11.7%;height:.82%;border-radius:999px}
    .f-anotacoes{left:73.6%;top:92.50%;width:11.4%;height:.82%;border-radius:999px}

    .f-indicadores{left:32.3%;top:93.90%;width:12.0%;height:.82%;border-radius:999px}
    .f-npcs{left:46.8%;top:93.90%;width:11.8%;height:.82%;border-radius:999px}
    .f-nacionais{left:59.7%;top:93.90%;width:11.7%;height:.82%;border-radius:999px}

    .f-vetores{left:46.8%;top:96.70%;width:11.8%;height:.82%;border-radius:999px}
