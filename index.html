<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heresia — Players</title>
  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:#f6f7ff;
    }
    body{
      display:flex;
      justify-content:center;
      font-family:Arial,Helvetica,sans-serif;
    }
    .page{
      position:relative;
      width:min(100%, 1068px);
      margin:0 auto;
      line-height:0;
    }
    .page-image{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }
    .hotspot{
      position:absolute;
      display:block;
      z-index:5;
      text-decoration:none;
      border-radius:20px;
      outline:none;
      background:transparent;
    }
    .hotspot:hover,
    .hotspot:focus-visible{
      background:rgba(32,41,92,.06);
      box-shadow:inset 0 0 0 2px rgba(32,41,92,.18);
    }

    /* Navegação superior */
    .top-heresia{left:24.2%;top:.35%;width:5.4%;height:.55%}
    .top-sistema{left:31.6%;top:.35%;width:5.3%;height:.55%}
    .top-players-1{left:39.1%;top:.35%;width:5.4%;height:.55%}
    .top-players-2{left:46.4%;top:.35%;width:5.5%;height:.55%}
    .top-mundo{left:55.1%;top:.35%;width:4.7%;height:.55%}
    .top-ideologias{left:61.4%;top:.35%;width:6.5%;height:.55%}
    .top-atos{left:70.8%;top:.35%;width:3.6%;height:.55%}
    .top-midia{left:76.4%;top:.35%;width:3.8%;height:.55%}
    .site{left:40.0%;top:2.0%;width:20.4%;height:1.55%;border-radius:999px}

    /* Blocos dos personagens */
    .castiel{left:0;top:10.65%;width:100%;height:13.0%}
    .ksenia{left:0;top:27.0%;width:100%;height:13.0%}
    .lucas{left:0;top:43.45%;width:100%;height:13.0%}
    .moira{left:0;top:59.35%;width:100%;height:13.0%}
    .thorfinn{left:0;top:75.65%;width:100%;height:13.1%}

    /* Footer principal */
    .f-heresia{left:6.2%;top:91.05%;width:11.2%;height:1.1%;border-radius:999px}
    .f-sistema{left:19.0%;top:91.05%;width:11.2%;height:1.1%;border-radius:999px}
    .f-personagens{left:32.1%;top:91.05%;width:12.2%;height:1.1%;border-radius:999px}
    .f-mundo{left:46.7%;top:91.05%;width:10.9%;height:1.1%;border-radius:999px}
    .f-ideologias{left:59.4%;top:91.05%;width:12.0%;height:1.1%;border-radius:999px}
    .f-atos{left:73.6%;top:91.05%;width:10.7%;height:1.1%;border-radius:999px}
    .f-midia{left:86.1%;top:91.05%;width:10.3%;height:1.1%;border-radius:999px}

    /* Footer secundário */
    .f-atributos{left:32.4%;top:92.55%;width:11.9%;height:1.0%;border-radius:999px}
    .f-mecanicas{left:46.8%;top:92.55%;width:11.8%;height:1.0%;border-radius:999px}
    .f-individuais{left:59.7%;top:92.55%;width:11.7%;height:1.0%;border-radius:999px}
    .f-anotacoes{left:73.6%;top:92.55%;width:11.4%;height:1.0%;border-radius:999px}

    .f-indicadores{left:32.4%;top:94.0%;width:11.9%;height:1.0%;border-radius:999px}
    .f-npcs{left:46.8%;top:94.0%;width:11.8%;height:1.0%;border-radius:999px}
    .f-nacionais{left:59.7%;top:94.0%;width:11.7%;height:1.0%;border-radius:999px}

    .f-dano{left:32.4%;top:95.45%;width:11.9%;height:1.0%;border-radius:999px}
    .f-ameacas{left:46.8%;top:95.45%;width:11.8%;height:1.0%;border-radius:999px}
    .f-vetores{left:46.8%;top:96.9%;width:11.8%;height:1.0%;border-radius:999px}

    @media(max-width:700px){
      .hotspot:hover{background:transparent;box-shadow:none}
    }
